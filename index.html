<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบสต็อกสินค้า</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<style>
  :root{--bg:#f4f6fa;--card:#fff;--text:#1d2433;--muted:#6b7385;--line:#e3e7ef;--pri:#06c755;--pri-d:#05a647;--pri2:#e6f9ee;
        --blue:#1f5fbf;--warn:#b76b00;--warnbg:#fff4e0;--bad:#c62828;--badbg:#fdeaea}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Sarabun',system-ui,sans-serif;font-size:16px}
  button,input,select,textarea{font:inherit}
  .hidden{display:none!important}
  header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
  header .top{display:flex;align-items:center;gap:8px;padding:10px 14px}
  header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .who{font-size:13px;color:var(--muted)}
  .tabs{display:flex}
  .tabs button{flex:1;border:0;background:none;padding:10px 4px;color:var(--muted);border-bottom:3px solid transparent;font-weight:600}
  .tabs button.on{color:var(--pri-d);border-bottom-color:var(--pri)}
  main{padding:12px 12px 120px;max-width:640px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .card h2{font-size:16px;margin:0 0 10px}
  label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
  input,select,textarea{width:100%;border:1px solid #cfd6e2;border-radius:9px;padding:10px 12px;background:#fff;color:var(--text)}
  input:focus,select:focus{outline:2px solid var(--pri2);border-color:var(--pri)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn{display:block;width:100%;border:0;border-radius:10px;padding:13px;background:var(--pri);color:#fff;font-weight:700;font-size:16px}
  .btn:active{background:var(--pri-d)} .btn:disabled{opacity:.5}
  .btn.sec{background:#fff;color:var(--text);border:1px solid var(--line)}
  .muted{color:var(--muted);font-size:13px}
  .center{text-align:center}
  .item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item .info{flex:1;min-width:0}
  .item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .item .sub{font-size:13px;color:var(--muted)}
  .add{border:1px solid var(--pri);background:var(--pri2);color:var(--pri-d);border-radius:8px;padding:6px 12px;font-weight:700}
  .add:disabled{border-color:var(--line);background:#f2f3f6;color:var(--muted)}
  .qty{display:flex;align-items:center;gap:4px}
  .qty button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:700}
  .qty input{width:70px;text-align:center;padding:7px 4px}
  .del{border:0;background:none;color:var(--bad);font-size:20px;padding:4px 6px}
  .low{color:var(--bad);font-weight:700}
  .warn{color:var(--warn)}
  .tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
  .t-IN{background:var(--pri2);color:var(--pri-d)} .t-OUT{background:var(--warnbg);color:var(--warn)}
  .t-ADJ{background:#e8f0fc;color:var(--blue)} .t-X{background:var(--badbg);color:var(--bad)}
  .footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:6}
  .footer .inner{max-width:640px;margin:0 auto}
  .seg{display:flex;background:#eef0f4;border-radius:10px;padding:3px;margin-bottom:6px}
  .seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:700;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  #toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;max-width:92vw;white-space:pre-line;z-index:50;font-size:14px}
  #toast.err{background:var(--bad)}
  .spinner{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto 12px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40}
  .modal .box{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  table{width:100%;border-collapse:collapse;font-size:14px} td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left} td.n,th.n{text-align:right}
</style>
</head>
<body>

<div id="vLoading" class="center"><div class="spinner"></div><div class="muted" id="loadMsg">กำลังเชื่อมต่อ LINE…</div></div>

<!-- Register -->
<div id="vRegister" class="hidden"><main>
  <div class="card">
    <h2>📝 ลงทะเบียนใช้งานระบบสต็อก</h2>
    <p class="muted">บัญชี LINE: <b id="rLineName"></b><br>กรอกชื่อจริงเพื่อให้ผู้ดูแลอนุมัติ</p>
    <label>ชื่อ-นามสกุล</label><input id="rName" autocomplete="name">
    <div style="height:12px"></div>
    <button class="btn" id="rBtn" onclick="doRegister()">ส่งคำขอ</button>
  </div>
</main></div>

<!-- Message (pending / error) -->
<div id="vMsg" class="hidden"><main><div class="card center"><div style="font-size:44px" id="mIcon">⏳</div><h2 id="mTitle"></h2><p class="muted" id="mText"></p>
  <button class="btn sec" onclick="location.reload()">ลองใหม่</button></div></main></div>

<!-- App -->
<div id="vApp" class="hidden">
  <header>
    <div class="top"><h1 id="hTitle">📦 ระบบสต็อก</h1><span class="who" id="hWho"></span></div>
    <div class="tabs" id="tabs">
      <button data-t="txn" class="on" onclick="tab('txn')">เบิก / รับ</button>
      <button data-t="bal" onclick="tab('bal')">คงเหลือ</button>
      <button data-t="hist" onclick="tab('hist')">ของฉัน</button>
    </div>
  </header>

  <!-- Transaction -->
  <main id="t-txn">
    <div class="seg" id="typeSeg">
      <button data-v="OUT" class="on" onclick="setType('OUT')">📤 เบิกออก</button>
      <button data-v="IN" onclick="setType('IN')">📥 รับเข้า</button>
    </div>
    <div class="card">
      <div class="row2">
        <div><label>คลัง</label><select id="fWh" onchange="renderAll()"></select></div>
        <div><label id="fPrjLabel">โครงการ</label><select id="fPrj"></select></div>
      </div>
      <div id="refBox" class="hidden"><label>เลขที่เอกสารอ้างอิง (ใบส่งของ / PO)</label><input id="fRef"></div>
      <label>หมายเหตุ</label><input id="fNote" placeholder="ไม่บังคับ">
    </div>

    <div class="card" id="cartCard">
      <h2>🧺 รายการที่เลือก <span class="muted" id="cartCount"></span></h2>
      <div id="cart"><p class="muted">ยังไม่มีรายการ — เลือกสินค้าด้านล่าง</p></div>
    </div>

    <div class="card">
      <h2>🔎 เลือกสินค้า</h2>
      <input id="fSearch" placeholder="ค้นหา ไทย / English / หมวด" oninput="renderPicker()" autocomplete="off">
      <div id="picker"></div>
    </div>
  </main>

  <!-- Balance -->
  <main id="t-bal" class="hidden">
    <div class="card">
      <div class="row2">
        <div><label>คลัง</label><select id="bWh" onchange="renderBal()"><option value="">ทุกคลัง</option></select></div>
        <div><label>&nbsp;</label><label style="display:flex;align-items:center;gap:6px;color:var(--text);margin:10px 0"><input type="checkbox" id="bLow" style="width:auto" onchange="renderBal()"> เฉพาะใกล้หมด</label></div>
      </div>
      <div><label style="display:flex;align-items:center;gap:6px;color:var(--text);margin:4px 0"><input type="checkbox" id="bAll" style="width:auto" onchange="renderBal()"> แสดงที่หมดแล้วด้วย</label>
      </div>
      <input id="bQ" placeholder="ค้นหา ไทย / English" oninput="renderBal()" style="margin-top:8px">
      <button class="btn sec" style="margin-top:8px" onclick="refresh()">🔄 โหลดยอดล่าสุด</button>
    </div>
    <div class="card" id="balList"></div>
  </main>

  <!-- History -->
  <main id="t-hist" class="hidden"><div class="card" id="histList"><p class="muted">กำลังโหลด…</p></div></main>

  <div class="footer" id="footer"><div class="inner">
    <button class="btn" id="submitBtn" onclick="confirmSubmit()" disabled>บันทึกการเบิก</button>
  </div></div>
</div>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="box" id="modalBox"></div></div>
<div id="toast" class="hidden"></div>

<script>
/* ===== ตั้งค่า: URL ของ Apps Script Web App (/exec) ===== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyEx6tE5qXKKbs00cOQhjLrRjr6-1t7dcqDgrdN4P_4-qt-WOzjYvRft7nzLAVYLGFU/exec';

const S = { type:'OUT', cart:[], data:null, busy:false };
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => (Number(n)||0).toLocaleString('th-TH',{maximumFractionDigits:4});
const TYPE = {IN:'รับเข้า', OUT:'เบิกออก', ADJ:'ปรับยอด'};
function toast(m, err){ const t=$('toast'); t.textContent=m; t.className=err?'err':''; clearTimeout(t._h); t._h=setTimeout(()=>t.className='hidden', err?6000:2500); }
function view(id){ ['vLoading','vRegister','vMsg','vApp'].forEach(v => $(v).classList.toggle('hidden', v!==id)); }
function msg(icon, title, text){ $('mIcon').textContent=icon; $('mTitle').textContent=title; $('mText').textContent=text||''; view('vMsg'); }

/* ===== API ===== */
async function api(action, payload){
  const res = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ liff:1, action, idToken: liff.getIDToken(), payload: payload||{} }) });
  const j = await res.json();
  if (!j.ok) {
    if (j.error === 'TOKEN_EXPIRED' || j.error === 'TOKEN_MISSING') { liff.logout(); liff.login({ redirectUri: location.href }); throw new Error('กำลังเข้าสู่ระบบใหม่…'); }
    throw new Error(j.error);
  }
  return j.data;
}

/* ===== Start ===== */
(async function start(){
  try {
    const cfg = await (await fetch(GAS_URL + '?liffconfig=1')).json();
    if (!cfg.liffId) return msg('⚙️','ยังไม่ได้ตั้งค่า LIFF','ผู้ดูแลต้องใส่ LIFF_ID ในหน้าเว็บ › ตั้งค่า › ตั้งค่าระบบ');
    await liff.init({ liffId: cfg.liffId });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    $('loadMsg').textContent = 'กำลังโหลดข้อมูล…';
    await boot();
  } catch(e) { msg('⚠️','เชื่อมต่อไม่สำเร็จ', e.message); }
})();

async function boot(){
  const d = await api('bootstrap');
  if (d.status === 'NOT_REGISTERED') { $('rLineName').textContent = d.lineName; $('rName').value = ''; return view('vRegister'); }
  if (d.status === 'PENDING') return msg('⏳','รอผู้ดูแลอนุมัติ','ส่งคำขอลงทะเบียนแล้ว เมื่อได้รับอนุมัติให้เปิดฟอร์มนี้อีกครั้ง');
  if (d.status !== 'ACTIVE') return msg('🔒','บัญชีถูกระงับ','กรุณาติดต่อผู้ดูแลระบบ');
  S.data = d;
  $('hTitle').textContent = '📦 ' + d.company;
  $('hWho').textContent = d.user.name;
  $('typeSeg').classList.toggle('hidden', !d.canReceive);
  const whOpts = d.warehouses.map(w => `<option value="${esc(w.code)}">${esc(w.name)}</option>`).join('');
  const keepWh = $('fWh').value;
  $('fWh').innerHTML = whOpts; $('fWh').value = keepWh || d.defaultWh;
  if (!$('fWh').value && d.warehouses[0]) $('fWh').value = d.warehouses[0].code;
  const keepB = $('bWh').value;
  $('bWh').innerHTML = '<option value="">ทุกคลัง</option>' + whOpts; $('bWh').value = keepB;
  const keepP = $('fPrj').value;
  $('fPrj').innerHTML = '<option value="">' + (d.requireProject ? '— เลือกโครงการ —' : '— ไม่ระบุ —') + '</option>' +
    d.projects.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
  $('fPrj').value = keepP;
  view('vApp'); setType(S.type); renderAll();
}

async function refresh(){ try { await boot(); toast('อัปเดตยอดล่าสุดแล้ว'); } catch(e){ toast(e.message, true); } }

async function doRegister(){
  const n = $('rName').value.trim(); if (!n) return toast('กรุณากรอกชื่อ-นามสกุล', true);
  $('rBtn').disabled = true;
  try { const r = await api('register', { fullName:n }); toast(r.message); await boot(); }
  catch(e){ toast(e.message, true); } finally { $('rBtn').disabled = false; }
}

/* ===== Tabs ===== */
function tab(t){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t===t));
  ['txn','bal','hist'].forEach(x => $('t-'+x).classList.toggle('hidden', x!==t));
  $('footer').classList.toggle('hidden', t!=='txn');
  if (t==='bal') renderBal();
  if (t==='hist') loadHist();
}
function setType(t){
  if (t==='IN' && !S.data.canReceive) t='OUT';
  S.type = t;
  document.querySelectorAll('#typeSeg button').forEach(b => b.classList.toggle('on', b.dataset.v===t));
  $('refBox').classList.toggle('hidden', t!=='IN');
  $('fPrjLabel').textContent = 'โครงการ' + (t==='OUT' && S.data.requireProject ? ' *' : '');
  renderAll();
}

/* ===== Picker & cart ===== */
const whQty = (it, wh) => Number((it.byWh||{})[wh] || 0);
function findItem(code){ return S.data.items.find(i => i.code === code); }
function renderAll(){ renderCart(); renderPicker(); }

function renderPicker(){
  if (!S.data) return;
  const q = $('fSearch').value.trim().toLowerCase(), wh = $('fWh').value;
  const inCart = new Set(S.cart.map(c => c.code));
  let rows = S.data.items.filter(i => !q || (i.name+' '+(i.nameEn||'')+' '+(i.category||'')).toLowerCase().includes(q));
  const total = rows.length; rows = rows.slice(0, 40);
  $('picker').innerHTML = rows.length ? rows.map(i => {
    const bal = whQty(i, wh), cannot = S.type==='OUT' && bal<=0;
    return `<div class="item"><div class="info"><div class="nm">${esc(i.name)}</div>
      <div class="sub">${i.nameEn?esc(i.nameEn)+' · ':''}คงเหลือ <span class="${bal<=0?'low':i.low?'warn':''}">${num(bal)} ${esc(i.unit)}</span></div></div>
      <button class="add" ${inCart.has(i.code)||cannot?'disabled':''} onclick="addToCart('${esc(i.code).replace(/'/g,"&#39;")}')">${inCart.has(i.code)?'✓':cannot?'หมด':'+ เพิ่ม'}</button></div>`;
  }).join('') + (total>40?`<p class="muted center">แสดง 40 จาก ${total} รายการ — พิมพ์ค้นหาให้แคบลง</p>`:'')
    : '<p class="muted">ไม่พบสินค้า</p>';
}
function addToCart(code){ if (!S.cart.some(c=>c.code===code)) S.cart.push({ code, qty:1 }); renderAll(); toast('เพิ่มแล้ว'); }
function removeFromCart(i){ S.cart.splice(i,1); renderAll(); }
function stepQty(i, d){ const c=S.cart[i]; c.qty = Math.max(0, Math.round((Number(c.qty)||0)+d)); renderCart(); }
function setQty(i, v){ S.cart[i].qty = v; updateSubmit(); }
function renderCart(){
  const wh = $('fWh').value;
  $('cartCount').textContent = S.cart.length ? '('+S.cart.length+')' : '';
  $('cart').innerHTML = S.cart.length ? S.cart.map((c,i) => {
    const it = findItem(c.code) || { name:c.code, unit:'', byWh:{} };
    const bal = whQty(it, wh), over = S.type==='OUT' && Number(c.qty) > bal;
    return `<div class="item"><div class="info"><div class="nm">${esc(it.name)}</div>
      <div class="sub">คงเหลือ ${num(bal)} ${esc(it.unit)}${over?' · <span class="low">เกินยอดคงเหลือ</span>':''}</div></div>
      <div class="qty"><button onclick="stepQty(${i},-1)">−</button>
        <input type="number" inputmode="decimal" min="0" step="any" value="${esc(c.qty)}" oninput="setQty(${i},this.value)">
        <button onclick="stepQty(${i},1)">+</button></div>
      <button class="del" onclick="removeFromCart(${i})">✕</button></div>`;
  }).join('') : '<p class="muted">ยังไม่มีรายการ — เลือกสินค้าด้านล่าง</p>';
  updateSubmit();
}
function updateSubmit(){
  const b=$('submitBtn'); const n=S.cart.filter(c=>Number(c.qty)>0).length;
  b.disabled = !n || S.busy;
  b.textContent = (S.type==='IN'?'บันทึกการรับเข้า':'บันทึกการเบิก') + (n?` (${n} รายการ)`:'');
}

/* ===== Submit ===== */
function confirmSubmit(){
  const lines = S.cart.filter(c => Number(c.qty) > 0);
  if (!lines.length) return;
  if (S.type==='OUT' && S.data.requireProject && !$('fPrj').value) return toast('กรุณาเลือกโครงการ', true);
  const wh=$('fWh'), prj=$('fPrj');
  const rows = lines.map(c => { const it=findItem(c.code)||{}; return `<tr><td>${esc(it.name||c.code)}</td><td class="n">${num(c.qty)} ${esc(it.unit||'')}</td></tr>`; }).join('');
  openModal(`<h2>ยืนยัน${TYPE[S.type]}</h2>
    <p class="muted">คลัง: <b>${esc(wh.options[wh.selectedIndex].text)}</b>${prj.value?'<br>โครงการ: <b>'+esc(prj.options[prj.selectedIndex].text)+'</b>':''}</p>
    <table>${rows}</table><div style="height:14px"></div>
    <button class="btn" id="okBtn" onclick="submitTxn()">ยืนยัน</button><div style="height:8px"></div>
    <button class="btn sec" onclick="closeModal()">แก้ไข</button>`);
}
async function submitTxn(){
  if (S.busy) return; S.busy = true; $('okBtn').disabled = true; $('okBtn').textContent = 'กำลังบันทึก…'; updateSubmit();
  if (!S.reqId) S.reqId = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  try {
    const r = await api('post', { type:S.type, wh:$('fWh').value, project:$('fPrj').value, ref:$('fRef').value, note:$('fNote').value,
      lines: S.cart.filter(c=>Number(c.qty)>0).map(c=>({ code:c.code, qty:c.qty })), clientRequestId: S.reqId });
    S.reqId = null; S.cart = []; $('fNote').value=''; $('fRef').value='';
    showResult(r);
    boot().catch(()=>{});
  } catch(e){ closeModal(); toast(e.message, true); }
  finally { S.busy = false; updateSubmit(); }
}
function showResult(r){
  const lows = r.lines.filter(l=>l.low);
  S.lastSummary = `✅ ${r.typeLabel} ${r.docNo}\n` + (r.projectName?`โครงการ: ${r.projectName}\n`:'') +
    r.lines.map(l => `• ${l.name} ${r.type==='IN'?'+':'-'}${num(l.qty)} ${l.unit} (เหลือ ${num(l.after)})`).join('\n');
  openModal(`<div class="center"><div style="font-size:48px">✅</div><h2>${esc(r.typeLabel)}สำเร็จ</h2><p><b>${esc(r.docNo)}</b></p></div>
    <table><tr><th>สินค้า</th><th class="n">จำนวน</th><th class="n">คงเหลือ</th></tr>${r.lines.map(l=>`<tr><td>${esc(l.name)}</td>
      <td class="n">${r.type==='IN'?'+':'−'}${num(l.qty)}</td><td class="n ${l.low?'low':''}">${num(l.after)} ${esc(l.unit)}</td></tr>`).join('')}</table>
    ${lows.length?`<p class="low">⚠️ ต่ำกว่าจุดสั่งซื้อ: ${lows.map(l=>esc(l.name)).join(', ')}</p>`:''}
    <div style="height:12px"></div>
    ${liff.isInClient()?'<button class="btn sec" onclick="shareToChat()">💬 ส่งสรุปเข้าแชท</button><div style="height:8px"></div>':''}
    <button class="btn" onclick="closeModal()">เสร็จ</button>`);
}
async function shareToChat(){
  try { await liff.sendMessages([{ type:'text', text: S.lastSummary.slice(0, 4900) }]); toast('ส่งเข้าแชทแล้ว'); }
  catch(e){ toast('ส่งเข้าแชทไม่ได้ (ต้องเปิด scope chat_message.write ใน LIFF)', true); }
}

/* ===== Balance ===== */
function renderBal(){
  if (!S.data) return;
  const q=$('bQ').value.trim().toLowerCase(), wh=$('bWh').value, low=$('bLow').checked, all=$('bAll').checked;
  const rows = S.data.items.filter(i => (!q || (i.name+' '+(i.nameEn||'')+' '+(i.category||'')).toLowerCase().includes(q)) && (!low || i.low)
    && (low || all || (wh ? whQty(i, wh) : i.total) > 0));
  $('balList').innerHTML = rows.length ? rows.slice(0,200).map(i => {
    const v = wh ? whQty(i, wh) : i.total;
    const per = wh ? '' : Object.keys(i.byWh||{}).filter(w=>i.byWh[w]).map(w=>`${esc(w)} ${num(i.byWh[w])}`).join(' · ');
    return `<div class="item"><div class="info"><div class="nm">${esc(i.name)}</div><div class="sub">${[i.nameEn?esc(i.nameEn):'', per, i.min?'Min '+num(i.min):''].filter(Boolean).join(' · ')||esc(i.category||'')}</div></div>
      <div style="text-align:right"><b class="${i.low?'low':''}">${num(v)}</b><div class="sub">${esc(i.unit)}</div></div></div>`;
  }).join('') : '<p class="muted">'+(!low && !all ? 'ไม่มีสินค้าคงเหลือ' : 'ไม่พบสินค้า')+'</p>';
}

/* ===== History ===== */
async function loadHist(){
  $('histList').innerHTML = '<p class="muted">กำลังโหลด…</p>';
  try {
    const rows = await api('history');
    $('histList').innerHTML = rows.length ? rows.map(h => `<div class="item" onclick="openDoc('${esc(h.docNo)}')">
      <div class="info"><div class="nm">${esc(h.docNo)} <span class="tag ${h.status==='POSTED'?'t-'+esc(h.type):'t-X'}">${h.status==='POSTED'?esc(h.typeLabel):'ยกเลิก'}</span></div>
      <div class="sub">${new Date(h.date).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})} · ${h.lines} รายการ${h.projectName?' · '+esc(h.projectName):''}</div></div>
      <span class="muted">›</span></div>`).join('') : '<p class="muted">ยังไม่มีรายการ</p>';
  } catch(e){ $('histList').innerHTML = '<p class="low">'+esc(e.message)+'</p>'; }
}
async function openDoc(docNo){
  try {
    const d = await api('doc', { docNo }); const h = d.header;
    openModal(`<h2>${esc(h.Doc_No)} <span class="tag ${h.Status==='POSTED'?'t-'+esc(h.Txn_Type):'t-X'}">${h.Status==='POSTED'?esc(d.typeLabel):'ยกเลิก'}</span></h2>
      <p class="muted">${new Date(h.Txn_Date).toLocaleString('th-TH')} · คลัง ${esc(h.WH_Code)}${d.projectName?'<br>โครงการ '+esc(d.projectName):''}${h.Note?'<br>หมายเหตุ: '+esc(h.Note):''}</p>
      <table>${d.lines.map(l=>`<tr><td>${esc(l.Item_Name)}</td><td class="n">${num(l.Qty)} ${esc(l.Unit)}</td></tr>`).join('')}</table>
      <div style="height:12px"></div><button class="btn sec" onclick="closeModal()">ปิด</button>`);
  } catch(e){ toast(e.message, true); }
}

function openModal(html){ $('modalBox').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal(){ $('modal').classList.add('hidden'); }
</script>
